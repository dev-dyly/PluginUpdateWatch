name: Release PluginUpdateWatch
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      loaders: ${{ steps.metadata.outputs.loaders }}
      game-versions: ${{ steps.metadata.outputs.game-versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a stable tag from main with matching release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 .github/scripts/release.py validate "${GITHUB_REF_NAME#v}"
  verify:
    needs: validate
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
  publish:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID || secrets.MODRINTH_PROJECT_ID }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-java-21
          path: artifact
      - name: Validate and prepare the exact tested JAR
        id: artifacts
        run: python3 .github/scripts/release.py prepare "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY"
      - name: Check optional Modrinth account and project before publishing anything
        id: modrinth
        run: python3 .github/scripts/release.py modrinth-preflight "$RELEASE_VERSION"
      - name: Add valid SpigotMC BBCode to the run summary
        run: |
          {
            echo '### SpigotMC update (BBCode)'
            echo '```bbcode'
            cat release/SPIGOT-UPDATE.bbcode
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the verified stable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PluginUpdateWatch ${{ needs.validate.outputs.version }} Stable
          body_path: release/RELEASE-NOTES.md
          draft: false
          prerelease: false
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            release/PluginUpdateWatch-${{ needs.validate.outputs.version }}.jar
            release/PluginUpdateWatch-${{ needs.validate.outputs.version }}.jar.sha256
            release/PluginUpdateWatch.jar
            release/PluginUpdateWatch.jar.sha256
            release/SPIGOT-UPDATE.bbcode
      - name: Publish the same verified JAR to Modrinth when configured
        if: steps.modrinth.outputs.enabled == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: release/PluginUpdateWatch-${{ needs.validate.outputs.version }}.jar
          version: ${{ needs.validate.outputs.version }}
          version-type: release
          name: PluginUpdateWatch ${{ needs.validate.outputs.version }} Stable
          changelog-file: release/RELEASE-NOTES.md
          loaders: ${{ needs.validate.outputs.loaders }}
          game-versions: ${{ needs.validate.outputs.game-versions }}
          game-version-filter: none
          java: |
            21
            25
          fail-mode: fail
